name: EventCraft quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure credential-free test environment
        run: cp .env.example .env

      - name: Run static, unit, coverage, build, audit, and diff checks
        run: npm run verify

      - name: Check release readiness
        run: npm run release:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser lifecycle and accessibility checks
        run: npm run test:e2e
