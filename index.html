<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EventCraft AI — GenAI-powered event planning assistant for weddings, birthdays, and community events with budgets, timelines, vendor checklists, and personalized ideas." />
    <title>EventCraft AI — Smart Event Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      .boot-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0d1117; color: #f1f3f5; font-family: Inter, system-ui, -apple-system, sans-serif; }
      .boot-spinner { width: 44px; height: 44px; border: 3px solid rgba(92, 124, 250, 0.2); border-top-color: #5c7cfa; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      .boot-loader-text { margin-top: 16px; font-size: 14px; font-weight: 500; color: #91a7ff; letter-spacing: 0.02em; }
      .boot-error-card { max-width: 440px; margin: 0 20px; text-align: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px 20px; }
      .boot-error-icon { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; background: rgba(239,68,68,0.15); color: #f87171; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
      .boot-error-title { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
      .boot-error-text { margin: 0 0 20px; font-size: 13px; color: #b6c2d1; line-height: 1.5; }
      .boot-error-button { background: #4c6ef5; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" class="boot-loader" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-loader-text">Loading EventCraft AI...</p>
      </div>
    </div>
    <noscript>EventCraft AI needs JavaScript enabled to plan your event.</noscript>
    <script src="/boot-error.js"></script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
