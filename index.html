<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EventCraft AI — GenAI-powered event planning assistant for weddings, birthdays, and community events with budgets, timelines, vendor checklists, and personalized ideas." />
    <title>EventCraft AI — Smart Event Planning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0d1117; color: #f1f3f5; font-family: Inter, system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(92, 124, 250, 0.2); border-top-color: #5c7cfa; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; font-weight: 500; color: #91a7ff; letter-spacing: 0.02em;">Loading EventCraft AI...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="max-width: 440px; margin: 0 20px; text-align: center; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px 20px;"><div style="width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; background: rgba(239,68,68,0.15); color: #f87171; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;">!</div><h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 700;">Loading Error</h2><p style="margin: 0 0 20px; font-size: 13px; color: #94a3b8; line-height: 1.5;">The frontend encountered a connection or cache issue. Please refresh the browser.</p><button onclick="window.location.reload(true)" style="background: #4c6ef5; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">Reload Page</button></div>';
        }
      });
    </script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
